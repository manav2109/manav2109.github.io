<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ink background -->
  <rect width="32" height="32" rx="5" fill="#1a1a2e"/>

  <!-- M (pink) — left half -->
  <polyline
    points="1.5,25 1.5,7 8,17 14.5,7 14.5,25"
    fill="none" stroke="#ff4e6a" stroke-width="2.8"
    stroke-linejoin="miter" stroke-linecap="round"/>

  <!-- R (teal) — right half -->
  <!-- vertical stem -->
  <line x1="17.5" y1="7" x2="17.5" y2="25"
    stroke="#4ecdc4" stroke-width="2.8" stroke-linecap="round"/>
  <!-- bowl: top → right curve → midpoint → back to stem -->
  <polyline
    points="17.5,7 23,7 26,10 26,13 23,16 17.5,16"
    fill="none" stroke="#4ecdc4" stroke-width="2.8"
    stroke-linejoin="round" stroke-linecap="round"/>
  <!-- leg -->
  <line x1="22.5" y1="16" x2="30.5" y2="25"
    stroke="#4ecdc4" stroke-width="2.8" stroke-linecap="round"/>
</svg>
